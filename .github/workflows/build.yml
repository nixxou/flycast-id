name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Flycast and libchdr
        shell: bash
        run: |
          git submodule update --init flycast
          git -C flycast submodule update --init core/deps/libchdr

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Smoke test
        shell: bash
        run: |
          # No rom here: it has to refuse cleanly, with nothing on stdout.
          out=$(./build/flycast-id.exe nosuchgame.zip) && exit 1 || true
          test -z "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: flycast-id
          path: build/flycast-id.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/flycast-id.exe
